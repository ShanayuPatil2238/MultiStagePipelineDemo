trigger:
- main

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: Build
    displayName: Build Job
    steps: 
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'
    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'SonarQube Cloud'
        organization: 'shanayupatil2238'
        scannerMode: 'dotnet'
        projectKey: 'ShanayuPatil2238_MultiStagePipelineDemo'
        projectName: 'MultiStagePipelineDemo'

    - script: dotnet restore
      displayName: Restore Packages

    - script: dotnet build --configuration $(buildConfiguration)
      displayName: Build Application

    - task: SonarCloudAnalyze@4
      displayName: 'Run SonarCloud Analysis'

    - script: dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
      displayName: Publish Application

    - task: SonarCloudPublish@4
      displayName: 'Publish Quality Gate Result'
      inputs:
        pollingTimeoutSec: '300'

    - powershell: |
        choco install trivy -y 
      displayName: 'Install Trivy'

    - script: trivy --version
      displayName: 'Verify Trivy'

    - script: |
        trivy fs .
      displayName: 'Trivy Filesystem Scan'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'


- stage: Dev
  displayName: Deploy to Dev
  dependsOn: Build
  jobs:
    - deployment: DevDeploy
      displayName: Deploy Dev
      environment: Dev

      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: drop

              - script: 
                  echo "Deploying to Development Environment..."
                  dir $(Pipeline.Workspace)
                displayName: Deploy Application


- stage: QA
  displayName: Deploy to QA
  dependsOn: Dev
  jobs:
    - deployment: DeployQA
      displayName: Deploy to QA
      environment: QA

      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: drop

              - script: echo "Deploying to QA Environment"
                displayName: Deploy Application

- stage: Production
  displayName: Deploy to Production
  dependsOn: QA
  jobs:
    - deployment: DeployProd
      displayName: Deploy to Production
      environment: Production

      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: drop
              - script:
                  echo "Deploying to Production Environment"
                displayName: Deploy Production
